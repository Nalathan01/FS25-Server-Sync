name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build exe
        shell: powershell
        run: |
          $version = "1.0.0.0"
          if ($env:GITHUB_REF_TYPE -eq "tag") { $version = ($env:GITHUB_REF_NAME.TrimStart("v")) + ".0" }
          & .\build.ps1 -Version $version

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: FS25-Server-Sync
          path: dist/*.exe
          if-no-files-found: error

      - name: Attach exe to release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --draft --title "FS25 Server Sync $($env:GITHUB_REF_NAME.TrimStart('v'))" --notes "" }
          gh release upload $env:GITHUB_REF_NAME "dist/FS25 Server Sync.exe" --clobber
