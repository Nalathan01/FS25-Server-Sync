<style>
:root {
  color-scheme: dark;
  --bg: #111315;
  --rail: #16181b;
  --surface: #1b1e21;
  --surface-2: #22262a;
  --surface-3: #2a2f34;
  --line: #2c3136;
  --line-soft: #23272b;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #8a8d88;
  --accent: #3fb8a9;
  --accent-hover: #55c7b9;
  --accent-soft: rgba(63, 184, 169, 0.14);
  --accent-ink: #04201d;
  --s-download: #3987e5;
  --s-update: #c98500;
  --s-link: #199e70;
  --s-check: #8b7be8;
  --s-remove: #d55181;
  --s-nodl: #d95926;
  --s-error: #d03b3b;
  --s-ok: #5f625d;
  --radius: 14px;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --mono: "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.45;
  display: grid;
  grid-template-columns: 300px 1fr;
  overflow: hidden;
}
button, input { font: inherit; color: inherit; }
::selection { background: var(--accent); color: var(--accent-ink); }
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 8px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

.rail { background: var(--rail); border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 12px; padding: 22px 20px 18px; }
.brand-mark {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(145deg, #5fd0c2, #2a978a);
  display: grid; place-items: center;
  box-shadow: 0 6px 18px rgba(63, 184, 169, 0.25), inset 0 1px 0 rgba(255,255,255,0.3);
}
.brand h1 { font-family: var(--font-display); font-size: 17px; font-weight: 650; margin: 0; letter-spacing: 0.2px; }
.brand p { margin: 0; font-size: 12px; color: var(--muted); }
.rail-label { padding: 6px 20px 8px; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.srv-list { overflow-y: auto; padding: 0 12px 10px; display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 0; }
.srv {
  display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center;
  padding: 10px; border-radius: 12px; border: 1px solid transparent; background: transparent;
  cursor: pointer; text-align: left; transition: background 0.15s, border-color 0.15s; width: 100%;
}
.srv:hover { background: var(--surface); }
.srv.active { background: var(--surface-2); border-color: rgba(63, 184, 169, 0.55); box-shadow: inset 3px 0 0 var(--accent); }
.srv-ico { width: 40px; height: 40px; border-radius: 10px; background: var(--surface-3); display: grid; place-items: center; color: var(--ink-2); position: relative; }
.srv-ico .live { position: absolute; right: -3px; top: -3px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--rail); }
.srv-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srv-host { font-size: 12px; color: var(--muted); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.add-srv { margin: 0 12px 12px; justify-content: center; }
.rail-foot { border-top: 1px solid var(--line-soft); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.foot-box { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 12px; padding: 10px 12px; }
.foot-box .k { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.foot-box .v { font-family: var(--mono); font-size: 12px; color: var(--ink-2); margin-top: 3px; word-break: break-all; }
.foot-box .v.missing { color: #ff9b9b; }
.foot-box .acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.foot-box .acts:empty { display: none; }

.main { overflow-y: auto; min-height: 0; position: relative; }
.hero {
  position: relative; overflow: hidden; padding: 38px 44px 28px; border-bottom: 1px solid var(--line-soft);
  background:
    radial-gradient(900px 320px at 0% 0%, rgba(63,184,169,0.16), transparent 70%),
    radial-gradient(700px 300px at 100% 0%, rgba(57,135,229,0.10), transparent 70%);
}
.hero-inner { display: grid; grid-template-columns: 1fr auto; gap: 28px; align-items: end; }
.eyebrow { font-size: 12px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--accent); font-weight: 650; display: flex; align-items: center; gap: 10px; }
.hero h2 { font-family: var(--font-display); font-size: 36px; line-height: 1.1; font-weight: 700; margin: 6px 0 12px; letter-spacing: -0.4px; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px;
  background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.08);
  font-size: 12.5px; color: var(--ink-2); max-width: 100%;
}
.pill.mono { font-family: var(--mono); font-size: 12px; }
.pill.link { cursor: pointer; }
.pill.link:hover { color: var(--ink); border-color: rgba(255,255,255,0.2); }
.pill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge-live { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; }
.hero-stat { text-align: right; padding-bottom: 4px; }
.hero-stat .num { font-family: var(--font-display); font-size: 60px; font-weight: 700; line-height: 1; letter-spacing: -1.5px; font-variant-numeric: tabular-nums; }
.hero-stat .lbl { font-size: 14px; color: var(--ink-2); margin-top: 4px; }

.flow { margin-top: 26px; display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; }
.flow-steps { display: flex; align-items: center; gap: 6px; }
.fstep { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.fstep b { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); font-size: 12px; color: var(--ink-2); }
.fstep.done b { background: rgba(63,184,169,0.16); border-color: rgba(63,184,169,0.5); color: #8fe0d4; }
.fstep.now { color: var(--ink); font-weight: 600; }
.fstep.now b { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 4px var(--accent-soft); }
.fline { width: 26px; height: 2px; background: var(--line); border-radius: 2px; }
.fline.done { background: rgba(63,184,169,0.5); }
.flow-act { display: flex; align-items: center; gap: 16px; justify-content: flex-end; }
.flow-act .hint { color: var(--ink-2); font-size: 13px; max-width: 540px; text-align: right; text-wrap: pretty; }
.flow-act .btn.big { height: 44px; padding: 0 22px; font-size: 14.5px; border-radius: 12px; }
.title-row { display: flex; align-items: center; gap: 10px; }
.icon-btn { background: transparent; border: 1px solid transparent; border-radius: 9px; width: 34px; height: 34px; display: grid; place-items: center; color: var(--muted); cursor: pointer; margin-top: 4px; }
.icon-btn:hover { color: var(--ink); background: rgba(255,255,255,0.06); border-color: var(--line); }
.icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.reverify { margin-top: 34px; text-align: center; }
.linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 13px; }
.linkish:hover { color: var(--ink); }
.linkish:disabled { opacity: 0.5; cursor: not-allowed; }

.compo { margin-top: 24px; }
.bar { display: flex; gap: 2px; height: 12px; }
.seg { height: 100%; min-width: 6px; border-radius: 2px; transform-origin: left; animation: grow 0.7s cubic-bezier(.2,.8,.2,1) both; cursor: pointer; }
.seg:first-child { border-radius: 4px 2px 2px 4px; }
.seg:last-child { border-radius: 2px 4px 4px 2px; }
.seg:only-child { border-radius: 4px; }

@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; }
.legend button { background: none; border: 0; padding: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.legend button:hover { color: var(--ink); }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; }
.legend b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

.content { padding: 22px 44px 120px; }
.alert { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; margin-bottom: 14px; background: rgba(208, 59, 59, 0.1); border: 1px solid rgba(208, 59, 59, 0.45); }
.alert.warn { background: rgba(250, 178, 25, 0.08); border-color: rgba(250, 178, 25, 0.4); }
.alert.info { background: rgba(57, 135, 229, 0.08); border-color: rgba(57, 135, 229, 0.4); }
.alert svg { flex-shrink: 0; margin-top: 2px; }
.alert strong { display: block; margin-bottom: 2px; }
.alert span { color: var(--ink-2); }

.toolbar {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 44px; background: rgba(17,19,21,0.84); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line-soft);
}
.chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.chip {
  border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; cursor: pointer;
  font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 7px; transition: all 0.15s;
}
.chip:hover { border-color: #3c434a; color: var(--ink); }
.chip.on { background: var(--ink); color: #111; border-color: var(--ink); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.chip .n { font-variant-numeric: tabular-nums; opacity: 0.75; }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; height: 36px; width: 260px; }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search input { background: none; border: 0; outline: 0; width: 100%; }

.btn {
  display: inline-flex; align-items: center; gap: 8px; border-radius: 10px; padding: 0 14px; height: 36px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.15s; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); border-color: #3c434a; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.primary:disabled { background: var(--surface-3); color: var(--muted); border-color: var(--surface-3); opacity: 1; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { color: var(--ink); background: var(--surface); }
.btn.small { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
.btn.danger { color: #ff9b9b; }
.btn .badge { background: rgba(0,0,0,0.2); border-radius: 999px; padding: 0 7px; font-size: 11px; line-height: 18px; }

.group { margin-top: 28px; }
.group-head { margin-bottom: 12px; }
.group-title { display: flex; align-items: center; gap: 10px; }
.group-title .sw { width: 12px; height: 12px; border-radius: 4px; }
.group-title h3 { font-family: var(--font-display); font-size: 19px; margin: 0; font-weight: 650; }
.group-title .count { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.group-desc { color: var(--ink-2); font-size: 13px; margin: 4px 0 0 22px; max-width: 800px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.card {
  position: relative; display: grid; grid-template-columns: 52px 1fr; gap: 14px; padding: 13px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--line-soft); animation: rise 0.35s ease both;
}
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.card .stripe { position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; }
.ico {
  width: 52px; height: 52px; border-radius: 12px; overflow: hidden; background: var(--surface-3); display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--ink-2); box-shadow: 0 0 0 1px rgba(255,255,255,0.05);
}
.ico img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-body { min-width: 0; }
.card-title { font-weight: 600; font-size: 14.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-name { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.tag { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line-soft); }
.tag.good { color: #8fe0d4; border-color: rgba(63,184,169,0.4); background: rgba(63,184,169,0.08); }
.tag.warn { color: #ffd27a; border-color: rgba(250,178,25,0.4); background: rgba(250,178,25,0.08); }
.note { font-size: 12.5px; color: var(--ink-2); margin-top: 7px; }
.compact .card { grid-template-columns: 40px 1fr; padding: 10px 12px; gap: 12px; }
.compact .ico { width: 40px; height: 40px; border-radius: 10px; font-size: 14px; }

.empty { text-align: center; padding: 90px 30px; color: var(--muted); max-width: 640px; margin: 0 auto; }
.empty h3 { color: var(--ink); font-family: var(--font-display); font-size: 24px; margin: 18px 0 8px; }
.empty p { margin: 0 0 22px; }
.empty .big { width: 76px; height: 76px; border-radius: 22px; margin: 0 auto; background: var(--accent-soft); display: grid; place-items: center; color: var(--accent); }
.steps { text-align: left; display: grid; gap: 10px; margin: 0 auto 26px; max-width: 460px; }
.steps div { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; color: var(--ink-2); }
.steps b { width: 24px; height: 24px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 12px; color: var(--ink); }

.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(5,6,7,0.62); backdrop-filter: blur(4px); display: none; }
.overlay.show { display: block; animation: fade 0.2s; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal {
  position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(620px, 92vw); max-height: 90vh;
  background: #1a1d20; border: 1px solid #343a40; border-radius: 18px; box-shadow: 0 30px 90px rgba(0,0,0,0.6);
  display: none; flex-direction: column;
}
.modal.show { display: flex; animation: fade 0.18s; }
.modal-head { padding: 22px 24px 6px; }
.modal-head h3 { margin: 0; font-family: var(--font-display); font-size: 21px; }
.modal-head p { margin: 6px 0 0; color: var(--ink-2); font-size: 13px; word-break: break-word; }
.modal-body { padding: 14px 24px; overflow-y: auto; }
.modal-foot { padding: 14px 24px 20px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--line-soft); }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
.field .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
.field .hint.warn { color: #ffd27a; }
.input-row { display: flex; gap: 8px; }
.input { flex: 1; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; outline: 0; min-width: 0; width: 100%; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input.mono { font-family: var(--mono); font-size: 12.5px; }
.sumlist { display: grid; gap: 8px; }
.sumrow { display: grid; grid-template-columns: 12px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line-soft); }
.sumrow .sw { width: 10px; height: 10px; border-radius: 3px; }
.sumrow small { display: block; color: var(--muted); font-size: 12px; }
.sumrow b { font-variant-numeric: tabular-nums; }
.check-line { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; color: var(--ink-2); font-size: 13px; cursor: pointer; }
.check-line input { margin-top: 3px; accent-color: var(--accent); }

.progress { height: 10px; border-radius: 999px; background: var(--surface-3); overflow: hidden; margin-top: 6px; }
.progress div { height: 100%; width: 0; background: linear-gradient(90deg, #2a978a, var(--accent)); border-radius: 999px; transition: width 0.3s; }
.progress.indet div { width: 30%; animation: indet 1.2s infinite ease-in-out; }
@keyframes indet { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
.progress-meta { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; min-height: 19px; }
.progress-cur { font-size: 13px; color: var(--muted); margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 19px; }
.phases { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 16px; }
.phase { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line-soft); }
.phase.on { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.phase.done { color: #8fe0d4; border-color: rgba(63,184,169,0.4); }

.toast {
  position: fixed; z-index: 60; left: 50%; bottom: 26px; transform: translate(-50%, 160%); max-width: min(720px, 92vw);
  background: #0b0c0d; border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; box-shadow: 0 16px 50px rgba(0,0,0,0.55);
  transition: transform 0.3s cubic-bezier(.2,.8,.2,1);
}
.toast.show { transform: translate(-50%, 0); }
.toast.err { border-color: rgba(208,59,59,0.6); }
.toast.ok { border-color: rgba(63,184,169,0.6); }
.lost { position: fixed; inset: 0; z-index: 70; background: rgba(5,6,7,0.8); display: none; place-items: center; color: var(--ink-2); font-size: 15px; }
.lost.show { display: grid; }
.rv-search { margin-bottom: 10px; width: 100%; }
.rv-list { display: grid; gap: 4px; max-height: 46vh; overflow-y: auto; padding-right: 4px; }
.rv-item { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 9px; background: var(--surface); border: 1px solid var(--line-soft); cursor: pointer; }
.rv-item:hover { border-color: #3c434a; }
.rv-item.on { border-color: var(--accent); background: rgba(63,184,169,0.08); }
.rv-item input { accent-color: var(--accent); width: 16px; height: 16px; }
.rv-item .t { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rv-item .f { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rv-item .v { font-size: 12px; color: var(--ink-2); }
.tooltip { position: fixed; pointer-events: none; z-index: 50; background: #0b0c0d; border: 1px solid var(--line); padding: 7px 10px; border-radius: 9px; font-size: 12.5px; opacity: 0; transition: opacity 0.12s; }
.tooltip.show { opacity: 1; }
</style>
</head>

async function api(path, body) {
  const opt = { headers: { "X-Token": token } };
  if (body !== undefined) { opt.method = "POST"; opt.body = JSON.stringify(body); opt.headers["Content-Type"] = "application/json"; }
  const r = await fetch(path, opt);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error ? tErr(data.error, data.arg) : t("errorN", { n: r.status }));
  return data;
}

function missingDlcs(plan) { return plan && plan.Dlcs ? plan.Dlcs.filter(d => d.Installed === false) : []; }
function flowHtml(s, plan, c, pending, busy) {
  const dlcMissing = missingDlcs(plan).length > 0;
  const blocked = !!(plan && (c.nodl || c.error || dlcMissing));
  let step, action, label, hint, disabled = busy;
  if (!plan || blocked) { step = 1; action = "check"; label = t(plan ? "doRecheck" : "doCheck"); hint = t(!blocked ? "h1" : dlcMissing ? "h1Dlc" : "h1Blocked"); }
  else if (pending > 0) { step = 2; action = "apply"; label = t("doApply"); hint = c.check ? t("h2First", { size: fmtBytes(plan.DownloadBytes) }) : t("h2"); if (state.gameRunning && s.IsActive) { disabled = true; hint = t("alertGameText"); } }
  else if (!s.IsActive) { step = 3; action = "activate"; label = t("doActivate"); hint = t("h3"); if (state.gameRunning) { disabled = true; hint = t("h3Game"); } }
  else { step = 4; action = state.gameRunning ? null : "launch"; label = t("doLaunch"); hint = t(state.gameRunning ? "h4Game" : "h4"); }
  const icons = { check: P.check, apply: P.sync, activate: P.play, launch: P.play };
  const steps = [1, 2, 3, 4].map(n => {
    const cls = n < step ? "done" : n === step ? "now" : "";
    const mark = n < step ? svg(13, '<path d="m5 12 5 5 9-10"/>', 3) : n;
    return `${n > 1 ? `<span class="fline ${n <= step ? "done" : ""}"></span>` : ""}<span class="fstep ${cls}"><b>${mark}</b>${esc(t("step" + n))}</span>`;
  }).join("");
  const badge = action === "apply" && pending ? `<span class="badge">${fmt(pending)}</span>` : "";
  const btn = action ? `<button class="btn primary big" id="flowBtn" data-a="${action}" ${disabled ? "disabled" : ""}>${svg(16, icons[action], 2.3)}${esc(label)}${badge}</button>` : "";
  return `<div class="flow"><div class="flow-steps">${steps}</div><div class="flow-act"><span class="hint">${esc(hint)}</span>${btn}</div></div>`;
}

const rv = { sel: new Set() };

function alertHtml(kind, title, text) {
  return `<div class="alert ${kind === "err" ? "" : kind}">${ALERT_ICON[kind]}<div><strong>${esc(title)}</strong><span>${esc(text)}</span></div></div>`;

function rowMatches(r) {
  if (state.filter !== "all" && r.Status !== state.filter) return false;
  const q = state.query.trim().toLowerCase();
  if (!q) return true;
  return (r.Title || "").toLowerCase().includes(q) || (r.FileName || "").toLowerCase().includes(q) || (r.Author || "").toLowerCase().includes(q);
}

function groupsHtml(plan) {
  let out = `<div id="groupsWrap">`;
  for (const g of GROUPS) {
    const rows = plan.Rows.filter(r => r.Status === g.key && rowMatches(r)).sort((a, b) => (Number(!!b.IsMap)-Number(!!a.IsMap)) || (a.Title || "").localeCompare(b.Title || "", LOCALES[LANG]));
    if (!rows.length) continue;
    out += `<section class="group ${g.compact ? "compact" : ""}"><div class="group-head"><div class="group-title"><span class="sw" style="background:${g.color}"></span><h3>${esc(t(g.label))}</h3><span class="count">${fmt(rows.length)}</span></div><p class="group-desc">${esc(t(g.desc, { size: fmtBytes(rows.reduce((a, r) => a + Math.max(0, r.Bytes), 0)) }))}</p></div>
      <div class="grid">${rows.map(r => cardHtml(r, g)).join("")}</div></section>`;
  }
  return out + `</div>`;
}

function cardHtml(r, g) {
  const fallback = mono(r.Title || r.ModName);
  const ico = r.HasIcon
    ? `<div class="ico"><img loading="lazy" src="/icon?id=${encodeURIComponent(state.sel)}&i=${r.I}&t=${token}&v=${encodeURIComponent(state.plan.Created)}" alt="" onerror="this.parentNode.textContent='${fallback}'"></div>`
    : `<div class="ico">${r.IsDir ? svg(22, P.folder) : fallback}</div>`;
  const tags = [];
  if (r.IsMap) tags.push(`<span class="tag good">${esc(t("tMap"))}</span>`);
  if (r.Version) tags.push(`<span class="tag">v${esc(r.Version)}</span>`);
  if (r.Bytes > 0) tags.push(`<span class="tag">${esc(fmtBytes(r.Bytes))}</span>`);
  if (r.Status === "update" && r.LocalVersion) tags.push(`<span class="tag warn">${esc(t("tLocal", { v: "v" + r.LocalVersion }))}</span>`);
  if (r.Status === "link" && r.SourceFolder) tags.push(`<span class="tag">${esc(t("tFrom", { f: r.SourceFolder === "_ServerDownloads" ? t("tStore") : r.SourceFolder === "." ? t("library") : r.SourceFolder }))}</span>`);
  if (r.Verified) tags.push(`<span class="tag good">✓ ${esc(t("tVerified"))}</span>`);
  if (r.Status !== "remove") tags.push(`<span class="tag">${esc(r.ModHub ? t("tModHub") : t("tNoModHub"))}</span>`);
  if (r.Status === "nodl" && r.InTarget) tags.push(`<span class="tag good">${esc(t("tInTarget"))}</span>`);
  if (r.IsDir) tags.push(`<span class="tag">${esc(t("tFolder"))}</span>`);
  let note = "";
  if (r.Status === "remove") note = `<div class="note">${esc(r.RemoveMode === "unlink" ? t("tUnlink") : t("tArchive"))}</div>`;
  if (r.Status === "error") note = `<div class="note" style="color:#ff9b9b">${esc(tErr(r.ErrorCode, r.ErrorArg))}</div>`;
  const sub = r.Author && r.Status !== "remove" ? `${esc(r.FileName)} · ${esc(r.Author)}` : esc(r.FileName);
  return `<article class="card"><span class="stripe" style="background:${g.color}"></span>${ico}<div class="card-body"><div class="card-title">${esc(r.Title || r.ModName)}</div><div class="card-name" title="${esc(r.FileName)}">${sub}</div><div class="tags">${tags.join("")}</div>${note}</div></article>`;
}

function bindTips(root) {
  const tip = $("tip");
  root.querySelectorAll("[data-tip]").forEach(el => {
    el.onmousemove = e => { tip.textContent = el.dataset.tip; tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY + 14) + "px"; tip.classList.add("show"); };
    el.onmouseleave = () => tip.classList.remove("show");
  });
}

function showModal(id) {
  document.querySelectorAll(".modal.show").forEach(m => m.classList.remove("show"));
  $("overlay").classList.add("show");
  $(id).classList.add("show");
}
function closeModal() {
  if ($("jobModal").classList.contains("show")) return;
  document.querySelectorAll(".modal.show").forEach(m => m.classList.remove("show"));
  $("overlay").classList.remove("show");
}
document.querySelectorAll("[data-close]").forEach(b => b.onclick = closeModal);
$("overlay").onclick = closeModal;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

async function loadState() {
  state.st = await api("/api/state");
  state.gameRunning = state.st.gameRunning;
  if (!state.sel || !state.st.servers.some(s => s.Id === state.sel)) state.sel = state.st.servers.length ? state.st.servers[0].Id : null;
}

async function loadPlan() {
  state.plan = null;
  if (!state.sel) return;
  const p = await api("/api/plan?id=" + encodeURIComponent(state.sel));
  state.plan = p.none ? null : p;
}

async function refresh() {
  await loadState();
  await loadPlan();
  renderRail();
  renderMain();
}

async function selectServer(id) {
  state.sel = id;
  state.filter = "all";
  state.query = "";
  try { await loadPlan(); } catch (e) { toast(e.message, true); }
  renderRail();
  renderMain();
  $("main").scrollTop = 0;
}

let targetTouched = false;
function updateTargetHint() {
  const lib = state.st.library || "";
  const tgt = $("fTarget").value.trim();
  const hint = $("fTargetHint");
  if (!tgt || !lib) { hint.textContent = ""; hint.className = "hint"; return; }
  const same = tgt.slice(0, 2).toLowerCase() === lib.slice(0, 2).toLowerCase();
  hint.textContent = same ? t("hintSameVol") : t("hintOtherVol");
  hint.className = "hint" + (same ? "" : " warn");
}
async function suggestTarget() {
  if (targetTouched || state.editing) return;
  try {
    const url = $("fUrl").value.trim();
    const r = await api("/api/suggest", { name: $("fName").value.trim(), url, user: $("fUser").value.trim(), pass: $("fPass").value, id: state.editing });
    if (!targetTouched && url === $("fUrl").value.trim()) { $("fTarget").value = r.path; updateTargetHint(); }
  } catch {}
}
function openServerModal(s) {
  state.editing = s ? s.Id : null;
  targetTouched = !!s;
  $("srvModalTitle").textContent = t(s ? "srvEdit" : "srvNew");
  $("fName").value = s ? s.Name : "";
  $("fUrl").value = s ? s.Url : "";
  $("fTarget").value = s ? s.Target : "";
  $("fUser").value = s && s.Username ? s.Username : "";
  $("fUser").placeholder = t("fUser");
  $("fPass").value = "";
  $("fPass").placeholder = s && s.HasPassword ? t("fPassKeep") : t("fPass");
  $("srvDelete").style.display = s ? "" : "none";
  showModal("srvModal");
  if (!s) suggestTarget();
  updateTargetHint();
  setTimeout(() => $("fName").focus(), 50);
}
$("fName").oninput = () => { clearTimeout(suggestTarget.h); suggestTarget.h = setTimeout(suggestTarget, 250); };
$("fUrl").oninput = () => { clearTimeout(suggestTarget.h); suggestTarget.h = setTimeout(suggestTarget, 600); };
$("fUser").oninput = $("fPass").oninput = () => { clearTimeout(suggestTarget.h); suggestTarget.h = setTimeout(suggestTarget, 800); };
$("fTarget").oninput = () => { targetTouched = true; updateTargetHint(); };
$("fTargetPick").onclick = async () => {
  try {
    const r = await api("/api/pick", { title: t("fTarget"), start: $("fTarget").value.trim() || state.st.library });
    if (r.path) { $("fTarget").value = r.path; targetTouched = true; updateTargetHint(); }
  } catch (e) { toast(e.message, true); }
};
$("srvSave").onclick = async () => {
  try {
    const isNew = !state.editing;
    const body = { id: state.editing, name: $("fName").value, url: $("fUrl").value, target: $("fTarget").value, user: $("fUser").value };
    if ($("fPass").value) body.pass = $("fPass").value;
    const r = await api("/api/server/save", body);
    state.sel = r.savedId;
    closeModal();
    await refresh();
    if (isNew) startCheck(false);
  } catch (e) { toast(e.message, true); }
};
$("srvDelete").onclick = async () => {
  const s = currentServer();
  if (!s || !confirm(t("deleteConfirm", { n: s.Name }))) return;
  try { await api("/api/server/delete", { id: s.Id }); state.sel = null; closeModal(); await refresh(); } catch (e) { toast(e.message, true); }
};

function openLibModal() {
  $("fLib").value = state.st.library || "";
  showModal("libModal");
}
$("libChange").onclick = openLibModal;
$("libOpen").onclick = () => api("/api/open", { path: state.st.library }).catch(e => toast(e.message, true));
$("fLibPick").onclick = async () => {
  try {
    const r = await api("/api/pick", { title: t("library"), start: $("fLib").value.trim() });
    if (r.path) $("fLib").value = r.path;
  } catch (e) { toast(e.message, true); }
};
$("libSave").onclick = async () => {
  try { await api("/api/library", { path: $("fLib").value }); closeModal(); await refresh(); } catch (e) { toast(e.message, true); }
};
$("addSrv").onclick = () => { if (!state.st.libraryExists) openLibModal(); else openServerModal(null); };

function openApplyModal() {
  const p = state.plan;
  if (!p) return;
  const c = counts(p);
  const rows = p.Rows;
  const sumBytes = st => rows.filter(r => r.Status === st).reduce((a, r) => a + Math.max(0, r.Bytes), 0);
  const unlink = rows.filter(r => r.Status === "remove" && r.RemoveMode === "unlink").length;
  const archive = rows.filter(r => r.Status === "remove" && r.RemoveMode !== "unlink").length;
  const line = (color, label, sub, val) => `<div class="sumrow"><span class="sw" style="background:${color}"></span><div>${esc(label)}${sub ? `<small>${esc(sub)}</small>` : ""}</div><b>${val}</b></div>`;
  let body = `<div class="sumlist">`;
  if (c.download) body += line("var(--s-download)", t("sDownload"), fmtBytes(sumBytes("download")), fmt(c.download));
  if (c.update) body += line("var(--s-update)", t("sUpdate"), fmtBytes(sumBytes("update")), fmt(c.update));
  if (c.check) body += line("var(--s-check)", t("sCheck"), fmtBytes(sumBytes("check")), fmt(c.check));
  if (c.link) body += line("var(--s-link)", p.SameVolume ? t("sLink") : t("sCopy"), "", fmt(c.link));
  if (c.remove) body += line("var(--s-remove)", t("sRemove"), t("sRemoveSub", { a: fmt(unlink), b: fmt(archive) }), fmt(c.remove));
  if (!c.download && !c.update && !c.check && !c.link && !c.remove) body += `<p>${esc(t("nothingToDo"))}</p>`;
  body += `</div>`;
  if (c.check) {
    const bits = p.DownloadBytes * 8;
    body += `<div class="alert info" style="margin:14px 0 0">${ALERT_ICON.info}<div><span>${esc(t("firstNote", { size: fmtBytes(p.DownloadBytes), a: fmtDur(bits / 50e6), b: fmtDur(bits / 16e6) }))}</span></div></div>`;
  }
  const needConfirm = !!(p.ForeignTarget && c.remove);
  if (needConfirm) body += `<label class="check-line"><input type="checkbox" id="foreignOk"><span>${esc(t("confirmForeign"))}</span></label>`;
  $("applySub").textContent = t("applySub", { p: p.Target });
  $("applyBody").innerHTML = body;
  $("applyGo").disabled = needConfirm;
  if (needConfirm) $("foreignOk").onchange = e => { $("applyGo").disabled = !e.target.checked; };
  showModal("applyModal");
}
$("applyGo").onclick = async () => {
  closeModal();
  try { await api("/api/apply", { id: state.sel }); pollJob(); } catch (e) { toast(e.message, true); }
};

async function startCheck(thorough) {
  try { await api("/api/check", { id: state.sel, thorough }); pollJob(); } catch (e) { toast(e.message, true); }
}

async function activate() {
  try { await api("/api/activate", { id: state.sel }); await refresh(); toast(t("activated"), "ok"); } catch (e) { toast(e.message, true); }
}
async function restorePrevious() {
  try { await api("/api/deactivate", {}); await refresh(); toast(t("restored"), "ok"); } catch (e) { toast(e.message, true); }
}

function fmtDur(sec) {
  if (!isFinite(sec) || sec < 60) return t("durLess");
  const min = Math.round(sec / 60);
  if (min < 60) return t("durMin", { n: fmt(min) });
  return t("durHour", { h: fmt(Math.floor(min / 60)), m: fmt(min % 60) });
}
const speed = { t: 0, b: 0, rate: 0, phase: "" };
function speedText(j) {
  const now = Date.now();
  if (speed.phase !== j.Phase || j.BytesDone < speed.b) { speed.t = now; speed.b = j.BytesDone; speed.rate = 0; speed.phase = j.Phase; return ""; }
  const dt = (now-speed.t) / 1000;
  if (dt >= 1) {
    const r = (j.BytesDone-speed.b) / dt;
    speed.rate = speed.rate ? speed.rate * 0.7 + r * 0.3 : r;
    speed.t = now;
    speed.b = j.BytesDone;
  }
  if (!speed.rate) return "";
  const left = Math.max(0, j.BytesTotal-j.BytesDone) / speed.rate;
  return fmtBytes(speed.rate) + "/s · " + t("eta", { t: fmtDur(left) });
}

function renderJob(j) {
  $("jobTitle").textContent = t(j.Kind === "apply" ? "jApply" : j.Kind === "verify" ? "jVerify" : "jCheck");
  $("jobPhase").textContent = j.Cancel ? t("stopping") : t(PHASE_KEY[j.Phase] || "pStart");
  const bar = $("jobBar");
  const useBytes = (j.Phase === "download" || j.Phase === "verify") && j.BytesTotal > 0;
  let pct = null;
  if (useBytes) pct = Math.min(100, j.BytesDone * 100 / j.BytesTotal);
  else if (j.Total > 1) pct = Math.min(100, j.Done * 100 / j.Total);
  bar.classList.toggle("indet", pct === null);
  bar.firstElementChild.style.width = pct === null ? "" : pct + "%";
  $("jobCount").textContent = j.Total > 1 ? t("ofN", { a: fmt(j.Done), b: fmt(j.Total) }) : "";
  const sp = useBytes ? speedText(j) : "";
  $("jobBytes").textContent = useBytes ? fmtBytes(j.BytesDone) + " / " + fmtBytes(j.BytesTotal) + (sp ? " · " + sp : "") : "";
  $("jobCur").textContent = j.Current || "";
  const order = j.Kind === "apply" ? PHASES.apply : (PHASES[j.Kind] || []);
  const idx = order.indexOf(j.Phase);
  $("jobPhases").innerHTML = order.map((p, i) => `<span class="phase ${i === idx ? "on" : i < idx ? "done" : ""}">${esc(t(PHASE_KEY[p]))}</span>`).join("");
  $("jobCancel").disabled = !!j.Cancel;
}

async function pollJob() {
  if (state.polling) return;
  state.polling = true;
  showModal("jobModal");
  if (state.st) { state.st.job = { Finished: false }; renderMain(); }
  let j = null;
  while (true) {
    try { j = await api("/api/job"); } catch { j = null; }
    if (!j) break;
    renderJob(j);
    if (j.Finished) break;
    await new Promise(r => setTimeout(r, 350));
  }
  state.polling = false;
  $("jobModal").classList.remove("show");
  $("overlay").classList.remove("show");
  if (j && j.ServerId) state.sel = j.ServerId;
  try { await refresh(); } catch (e) { toast(e.message, true); }
  if (!j) return;
  if (j.ErrorCode) toast(tErr(j.ErrorCode, j.ErrorArg), j.ErrorCode === "cancelled" ? undefined : true);
  else if (j.Kind === "apply") toast(j.Compared ? t("doneStats", { c: fmt(j.Compared), i: fmt(j.Identical), s: fmt(j.Saved), b: fmtBytes(j.SavedBytes) }) : t("doneStatsNone"), "ok");
  else toast(t("doneCheck"), "ok");
}
$("jobCancel").onclick = () => api("/api/job/cancel", {}).catch(() => {});

async function ping() {
  try {
    const r = await api("/api/ping");
    if (r.gameRunning !== state.gameRunning) {
      state.gameRunning = r.gameRunning;
      if (state.st && !state.polling) { state.st.gameRunning = r.gameRunning; renderMain(); }
    }
    $("lost").classList.remove("show");
    ping.failed = 0;
    return r;
  } catch {
    if (state.polling) return null;
    ping.failed = (ping.failed || 0) + 1;
    if (ping.failed >= 2) $("lost").classList.add("show");
    if (ping.failed >= 4) window.close();
    return null;
  }
}

(async () => {
  const urlLang = new URLSearchParams(location.search).get("lang");
  const first = await ping();
  LANG = I18N[urlLang] ? urlLang : (first && I18N[first.lang] ? first.lang : "de");
  applyStaticTexts();
  setInterval(ping, 4000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) ping(); });
  try {
    await refresh();
    if (state.st.job && !state.st.job.Finished) pollJob();
  } catch (e) { toast(e.message, true); }
})();
</script>
</body>
</html>
